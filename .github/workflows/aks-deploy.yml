name: 'Azure Cost Dashboard Container GitOps Pipeline'

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: 'Package and Deploy API to AKS'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
      AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # NOTE: prefer OIDC federation over long-lived client secrets for
    # production (create an Entra app + federated credential and use
    # azure/login with auth-type: OIDC).
    - name: Azure CLI Login
      uses: azure/login@v2
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

    - name: Authenticate ACR Docker Registry
      run: az acr login --name "${{ secrets.ACR_NAME }}"

    # Packages your real Express app/Node files into a clean Docker image
    - name: Build and Push Cost Backend Image
      run: |
        docker build -t "${{ secrets.ACR_NAME }}.azurecr.io/cost-backend:latest" ./backend
        docker push "${{ secrets.ACR_NAME }}.azurecr.io/cost-backend:latest"

    - name: Connect to AKS Cluster Context
      uses: azure/aks-set-context@v4
      with:
        resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

    - name: Run Helm Upgrade Deployment
      run: |
        helm upgrade --install cost-backend ./charts/cost-backend --namespace default \
          --set image.repository="${{ secrets.ACR_NAME }}.azurecr.io/cost-backend"
