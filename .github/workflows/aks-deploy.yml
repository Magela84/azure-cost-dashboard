# ============================================================
# AZURE COST DASHBOARD - CONTAINER CI PIPELINE
# Builds the backend container and pushes it to Azure Container Registry.
# ============================================================

name: 'Azure Cost Dashboard Container CI Pipeline'


# ------------------------------------------------------------
# TRIGGER
# Runs when code is pushed to the main branch.
# ------------------------------------------------------------

on:
  push:
    branches: [ "main" ]


# ------------------------------------------------------------
# PERMISSIONS
# id-token: write is required for Azure OIDC authentication.
# ------------------------------------------------------------

permissions:
  contents: read
  id-token: write


# ============================================================
# BUILD AND DEPLOY JOB
# ============================================================

jobs:
  build-and-deploy:

    name: 'Build and Push API Container'
    runs-on: ubuntu-latest


    steps:

      # --------------------------------------------------------
      # STEP 1: CHECKOUT CODE
      # Downloads the repository to the GitHub runner.
      # --------------------------------------------------------

      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # STEP 2: AZURE LOGIN USING OIDC
      # Secure Azure authentication without a client secret.
      # --------------------------------------------------------

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # --------------------------------------------------------
      # STEP 3: LOGIN TO AZURE CONTAINER REGISTRY
      # Allows Docker to push the backend image to ACR.
      # --------------------------------------------------------

      - name: Authenticate ACR Docker Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"


      # --------------------------------------------------------
      # STEP 4: BUILD AND PUSH BACKEND IMAGE
      # Builds the backend Docker image and pushes it to ACR.
      # --------------------------------------------------------

      - name: Build and Push Cost Backend Image
        run: |
          docker build -t "${{ secrets.ACR_NAME }}.azurecr.io/cost-backend:latest" ./backend
          docker push "${{ secrets.ACR_NAME }}.azurecr.io/cost-backend:latest"
